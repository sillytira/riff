name: iOS build
on:
  workflow_dispatch:
  push:
    branches: ['ios/**']
    paths: ['ios/**', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install project generator
        run: brew install xcodegen
      - name: Compile for simulator
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project Riff.xcodeproj -scheme Riff -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned device IPA
        run: ios/scripts/build-unsigned.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Riff-unsigned
          path: ios/build/Riff-unsigned.ipa
          if-no-files-found: error
