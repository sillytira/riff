name: iOS build
on:
  workflow_dispatch:
  push:
    branches: ['ios/**']
    paths: ['ios/**', '.github/workflows/ios.yml']
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install project generator
        run: brew install xcodegen
      - name: Prepare standalone extraction runtime
        run: ios/scripts/prepare-python.sh
      - name: Test extraction protocol
        run: PYTHONPATH=ios/PythonApp:ios/Dependencies/python-packages python3 -m unittest discover -s ios/PythonTests -v
      - name: Compile for simulator
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project Riff.xcodeproj -scheme Riff -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS="$(uname -m)" CODE_SIGNING_ALLOWED=NO build
      - name: Boot iPhone simulator
        timeout-minutes: 10
        run: |
          RIFF_DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for group in reversed(list(d["devices"].values())) for v in group if v["name"].startswith("iPhone")))')
          echo "RIFF_DEVICE_ID=$RIFF_DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$RIFF_DEVICE_ID" -b
      - name: Test native services on iPhone
        timeout-minutes: 10
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p build
          python3 -m http.server 8765 --bind 127.0.0.1 --directory RiffTests/Fixtures > build/fixture-server.log 2>&1 &
          RIFF_FIXTURE_PID=$!
          trap 'kill "$RIFF_FIXTURE_PID"' EXIT
          xcodebuild -project Riff.xcodeproj -scheme Riff -destination "platform=iOS Simulator,id=$RIFF_DEVICE_ID" -parallel-testing-enabled NO -only-testing:RiffTests -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 ARCHS="$(uname -m)" CODE_SIGNING_ALLOWED=NO -resultBundlePath build/NativeTests.xcresult test 2>&1 | tee build/native-tests.log
      - name: Test native interface on iPhone
        timeout-minutes: 10
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Riff.xcodeproj -scheme Riff -destination "platform=iOS Simulator,id=$RIFF_DEVICE_ID" -parallel-testing-enabled NO -only-testing:RiffUITests -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 ARCHS="$(uname -m)" CODE_SIGNING_ALLOWED=NO -resultBundlePath build/UITests.xcresult test 2>&1 | tee build/ui-tests.log
      - name: Export UI test screenshots
        if: always()
        run: |
          if [ -f ios/build/UITests.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path ios/build/UITests.xcresult --output-path ios/build/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-validation
          path: |
            ios/build/screenshots
            ios/build/NativeTests.xcresult
            ios/build/UITests.xcresult
            ios/build/*.log
          if-no-files-found: ignore
      - name: Build unsigned device IPA
        run: ios/scripts/build-unsigned.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Riff-unsigned
          path: ios/build/Riff-unsigned.ipa
          if-no-files-found: error
