name: Riff
options:
  bundleIdPrefix: io.github.rootscripts
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
    SWIFT_OBJC_BRIDGING_HEADER: Riff/Runtime/RiffBridge.h
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Riff
    MARKETING_VERSION: '0.7.5'
    CURRENT_PROJECT_VERSION: 1
targets:
  Riff:
    type: application
    platform: iOS
    sources: [Riff]
    dependencies:
      - framework: Dependencies/Python.xcframework
        embed: true
    postCompileScripts:
      - name: Embed Python runtime and extractor
        script: bash "$PROJECT_DIR/scripts/embed-python.sh"
        basedOnDependencyAnalysis: false
    info:
      path: Riff/Info.plist
      properties:
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rootscripts.riff.ios
  RiffTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RiffTests]
    dependencies:
      - target: Riff
schemes:
  Riff:
    build:
      targets:
        Riff: all
    test:
      targets: [RiffTests]
      environmentVariables:
        RIFF_FIXTURE_SERVER: http://127.0.0.1:8765
