name: Riff
options:
  bundleIdPrefix: io.github.rootscripts
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Riff
    MARKETING_VERSION: '0.7.5'
    CURRENT_PROJECT_VERSION: 1
targets:
  Riff:
    type: application
    platform: iOS
    sources: [Riff]
    info:
      path: Riff/Info.plist
      properties:
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rootscripts.riff.ios
  RiffTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RiffTests]
    dependencies:
      - target: Riff
schemes:
  Riff:
    build:
      targets:
        Riff: all
    test:
      targets: [RiffTests]
