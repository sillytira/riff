name: Riff
options:
  bundleIdPrefix: io.github.rootscripts
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
    SWIFT_OBJC_BRIDGING_HEADER: Riff/Runtime/RiffBridge.h
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Riff
    MARKETING_VERSION: '0.7.5'
    CURRENT_PROJECT_VERSION: 1
targets:
  Riff:
    type: application
    platform: iOS
    sources:
      - path: Riff
      - path: ../native-codecs/build/Licenses
        type: folder
        buildPhase: resources
    dependencies:
      - framework: ../native-codecs/build/RiffCodecs.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - sdk: libiconv.tbd
      - framework: Dependencies/Python.xcframework
        embed: true
    postCompileScripts:
      - name: Embed Python runtime and extractor
        script: bash "$PROJECT_DIR/scripts/embed-python.sh"
        basedOnDependencyAnalysis: false
    info:
      path: Riff/Info.plist
      properties:
        UIBackgroundModes: [audio]
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio files
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.xiph.ogg-audio
            UTTypeDescription: Ogg audio
            UTTypeConformsTo: [public.audio]
            UTTypeTagSpecification:
              public.filename-extension: [ogg, oga]
          - UTTypeIdentifier: org.xiph.opus
            UTTypeDescription: Opus audio
            UTTypeConformsTo: [public.audio]
            UTTypeTagSpecification:
              public.filename-extension: [opus]
          - UTTypeIdentifier: com.microsoft.windows-media-wma
            UTTypeDescription: Windows Media audio
            UTTypeConformsTo: [public.audio]
            UTTypeTagSpecification:
              public.filename-extension: [wma]
          - UTTypeIdentifier: io.github.rootscripts.riff.ape-audio
            UTTypeDescription: Monkey’s Audio
            UTTypeConformsTo: [public.audio]
            UTTypeTagSpecification:
              public.filename-extension: [ape]
          - UTTypeIdentifier: io.github.rootscripts.riff.wavpack-audio
            UTTypeDescription: WavPack audio
            UTTypeConformsTo: [public.audio]
            UTTypeTagSpecification:
              public.filename-extension: [wv]
          - UTTypeIdentifier: io.github.rootscripts.riff.tta-audio
            UTTypeDescription: True Audio
            UTTypeConformsTo: [public.audio]
            UTTypeTagSpecification:
              public.filename-extension: [tta]
          - UTTypeIdentifier: io.github.rootscripts.riff.musepack-audio
            UTTypeDescription: Musepack audio
            UTTypeConformsTo: [public.audio]
            UTTypeTagSpecification:
              public.filename-extension: [mpc, mpp, mp+]
        NSLocalNetworkUsageDescription: Riff connects to a local music server when you open its audio URL.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rootscripts.riff.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RiffTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RiffTests
        excludes: [Fixtures/hls]
    dependencies:
      - target: Riff
  RiffUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RiffUITests]
    dependencies:
      - target: Riff
schemes:
  Riff:
    build:
      targets:
        Riff: all
    test:
      targets: [RiffTests, RiffUITests]
      environmentVariables:
        RIFF_FIXTURE_SERVER: http://127.0.0.1:8765
